name: TimeTree to iCal Sync

on:
  schedule:
    # 毎日日本時間の午前5時（UTC 20:00）に自動実行
    - cron: '0 20 * * *'
  workflow_dispatch: # 手動実行ボタン

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    # 安全なブラウザのふりをしてTimeTreeのデータを直接ICS形式で正しくダウンロードします
    - name: Download TimeTree iCal directly
      env:
        TIMETREE_ID: ${{ secrets.TIMETREE_CALENDAR_ID }}
      run: |
        curl -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" "https://timetreeapp.com{TIMETREE_ID}.ics" -o timetree_future.ics

    - name: Commit and Push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add timetree_future.ics
        git commit -m "Update calendar" || exit 0
        git push
